[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotsmith"
version = "0.1.0"
description = "工厂总图规划师的智能格式互转工具（零 GDAL 纯 Python）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.0",
    "shapely>=2.0",
    "pyproj>=3.0",
    "pyshp>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

# requests 只在 `map-layers suggest`（LLM 图层语义建议）时用到，
# 核心转换链路懒加载，未安装也能正常使用。
[project.optional-dependencies]
llm = ["requests>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
plotsmith = "plotsmith.cli:cli"

[tool.setuptools.packages.find]
include = ["plotsmith*"]
